<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dino Sprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centered game stage under a compact header; touch buttons appear only on touch devices. */
:root {
  --bg: #e6ecf1;
  --panel: #f4f7fa;
  --ink: #1b2531;
  --muted: #566475;
  --line: #bfcad6;
  --accent: #0b8a70;
  --accent-ink: #ffffff;
  --btn: #dbe4ec;
  --btn-hover: #cdd9e3;
  --display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --body: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131c;
    --panel: #151d29;
    --ink: #e3ebf3;
    --muted: #94a3b5;
    --line: #2a3647;
    --accent: #4fdcb1;
    --accent-ink: #07211a;
    --btn: #1e2938;
    --btn-hover: #283649;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131c;
  --panel: #151d29;
  --ink: #e3ebf3;
  --muted: #94a3b5;
  --line: #2a3647;
  --accent: #4fdcb1;
  --accent-ink: #07211a;
  --btn: #1e2938;
  --btn-hover: #283649;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.top > div { min-width: 0; }
h1 {
  font-family: var(--display);
  font-size: clamp(18px, 4.4vw, 26px);
  line-height: 1.25;
  margin: 0 0 8px;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); max-width: 46ch; }
.tools { display: flex; gap: 8px; }
.btn {
  font: 500 14px/1 var(--body);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.btn:hover { background: var(--btn-hover); }
.btn:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage {
  border: 2px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: var(--panel);
}
canvas { display: block; width: 100%; height: auto; touch-action: manipulation; outline: none; cursor: pointer; }
.touch { display: none; gap: 12px; }
.touch .btn {
  flex: 1;
  padding: 22px 12px;
  font-size: 16px;
  font-weight: 700;
  touch-action: none;
}
.touch .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (hover: none), (pointer: coarse) { .touch { display: flex; } }
.keys { display: flex; flex-wrap: wrap; gap: 10px 22px; list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 14px; }
.keys li { display: flex; align-items: center; gap: 8px; }
kbd {
  font: 700 12px/1 var(--body);
  color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--line);
  border-bottom-width: 3px;
  border-radius: 6px;
  padding: 5px 8px;
}
</style>

<main class="wrap">
  <header class="top">
    <div>
      <h1>Dino Sprint</h1>
      <p class="sub">Kaktuslardan sakrang, pterodaktillar ostidan egilib o'ting. Tezlik tobora oshib boradi.</p>
    </div>
    <div class="tools">
      <button class="btn" id="btnPause" type="button">Pauza</button>
      <button class="btn" id="btnMute" type="button">Ovoz: yoqiq</button>
    </div>
  </header>

  <section class="stage">
    <canvas id="game" tabindex="0" aria-label="Dino Sprint o'yin maydoni"></canvas>
  </section>

  <div class="touch">
    <button class="btn" id="btnDuck" type="button">Egilish</button>
    <button class="btn go" id="btnJump" type="button">Sakrash</button>
  </div>

  <ul class="keys">
    <li><kbd>Bo'sh joy</kbd> <kbd>&uarr;</kbd> sakrash (uzoq bosilsa balandroq)</li>
    <li><kbd>&darr;</kbd> egilish, havoda tez tushish</li>
    <li><kbd>P</kbd> pauza</li>
    <li><kbd>M</kbd> ovoz</li>
  </ul>
</main>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var H = 250, GROUND = 210;
  var W = 800;
  var START_SPEED = 6.2, MAX_SPEED = 14.5;
  var FONT = "'Press Start 2P', ui-monospace, monospace";

  /* ---------- palette: [day, night], blended by the night factor ---------- */
  var PAL = {
    sky:   [[226, 236, 244], [10, 15, 28]],
    hill:  [[208, 222, 234], [19, 28, 48]],
    cloud: [[250, 252, 254], [36, 48, 72]],
    ink:   [[36, 46, 58],    [196, 210, 226]],
    inkL:  [[88, 102, 118],  [146, 164, 188]],
    dino:  [[22, 164, 132],  [72, 222, 182]],
    dinoD: [[10, 104, 92],   [30, 150, 125]],
    belly: [[176, 242, 212], [196, 250, 226]],
    white: [[255, 255, 255], [255, 255, 255]],
    moon:  [[255, 248, 214], [255, 248, 214]]
  };
  var pal = {};
  function buildPal(n) {
    for (var k in PAL) {
      var a = PAL[k][0], b = PAL[k][1];
      pal[k] = 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * n) + ',' +
        Math.round(a[1] + (b[1] - a[1]) * n) + ',' +
        Math.round(a[2] + (b[2] - a[2]) * n) + ')';
    }
  }
  buildPal(0);

  /* ---------- state ---------- */
  var state = 'ready'; // ready | running | paused | dead
  var last = performance.now();
  var animT = 0, dist = 0, speed = START_SPEED, score = 0, hi = 0;
  var night = 0, nightTarget = 0, prevTarget = 0, nightCount = 0;
  var flash = 0, lastMile = 0, shake = 0, deadAt = 0, newRecord = false, spawnWait = 70, jumpBuf = 0;
  var obstacles = [], clouds = [], stars = [], bumps = [];
  var dino = { x: 50, lift: 0, vy: 0 };
  var jumpHeld = false, duckHeld = false;
  var muted = false;

  try { hi = parseInt(localStorage.getItem('dino-sprint-hi') || '0', 10) || 0; } catch (e) {}

  /* ---------- sound ---------- */
  var actx = null;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (muted) return;
    var a = audio();
    if (!a) return;
    try {
      var t0 = a.currentTime + (delay || 0);
      var o = a.createOscillator();
      var g = a.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol || 0.05, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(a.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  var sfx = {
    jump: function () { tone(360, 0.17, 'square', 0.045, 760); },
    point: function () { tone(880, 0.08, 'square', 0.04); tone(1320, 0.12, 'square', 0.04, null, 0.08); },
    die: function () { tone(320, 0.18, 'sawtooth', 0.07, 120); tone(160, 0.4, 'square', 0.06, 40, 0.14); }
  };

  /* ---------- sizing ---------- */
  function rand(a, b) { return a + Math.random() * (b - a); }

  function initScenery() {
    clouds = [];
    for (var i = 0; i < 5; i++) clouds.push({ x: rand(0, W), y: rand(18, 92), s: rand(0.7, 1.2) });
    stars = [];
    for (var j = 0; j < 46; j++) stars.push({ x: rand(0, W), y: rand(8, 130), s: Math.random() < 0.2 ? 2 : 1, p: rand(0, 6.28) });
    bumps = [];
    for (var k = 0; k < Math.round(W / 11); k++) bumps.push({ x: rand(0, W), y: GROUND + 7 + rand(0, 26), w: 2 + Math.floor(rand(0, 7)) });
  }

  function resize() {
    var nw = window.innerWidth < 560 ? 600 : 800;
    var changed = nw !== W;
    W = nw;
    cv.style.aspectRatio = W + ' / ' + H;
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var cw = Math.max(200, r.width);
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(cw * (H / W) * dpr);
    if (changed || !clouds.length) initScenery();
  }

  /* ---------- obstacles ---------- */
  var GROUPS = [['S'], ['S'], ['L'], ['L'], ['S', 'S'], ['L', 'S'], ['S', 'S', 'S'], ['L', 'L']];
  var DIM = { S: { w: 22, h: 36 }, L: { w: 30, h: 52 } };
  var PTERO_Y = { low: 170, mid: 146, high: 98 };

  function spawn() {
    var o;
    var prev = obstacles.length ? obstacles[obstacles.length - 1] : null;
    if (score > 250 && Math.random() < 0.3 && !(prev && prev.kind === 'ptero')) {
      var r = Math.random();
      var lv = r < 0.35 ? 'low' : (r < 0.75 ? 'mid' : 'high');
      o = { kind: 'ptero', x: W + 20, y: PTERO_Y[lv], w: 54, h: 30 };
    } else {
      var n = score < 150 ? 4 : (score < 400 ? 6 : 8);
      var g = GROUPS[Math.floor(Math.random() * n)];
      var parts = [], dx = 0, mh = 0;
      for (var i = 0; i < g.length; i++) {
        var d = DIM[g[i]];
        parts.push({ dx: dx, s: g[i], w: d.w, h: d.h });
        dx += d.w + 4;
        if (d.h > mh) mh = d.h;
      }
      o = { kind: 'cactus', x: W + 20, parts: parts, w: dx - 4, h: mh };
    }
    o.gap = Math.min(820, speed * 38 * (0.85 + Math.random() * 0.9) + 90);
    obstacles.push(o);
  }

  function boxesOf(o) {
    if (o.kind === 'ptero') return [{ x: o.x + 6, y: o.y + 6, w: 42, h: 18 }];
    var out = [];
    for (var i = 0; i < o.parts.length; i++) {
      var p = o.parts[i];
      out.push({ x: o.x + p.dx + 3, y: GROUND - p.h + 2, w: p.w - 6, h: p.h - 2 });
    }
    return out;
  }

  function dinoBoxes() {
    var ducking = duckHeld && dino.lift === 0;
    var y;
    if (ducking) {
      y = GROUND - dino.lift - 34;
      return [{ x: dino.x + 8, y: y + 10, w: 36, h: 24 }, { x: dino.x + 40, y: y + 8, w: 18, h: 12 }];
    }
    y = GROUND - dino.lift - 50;
    return [{ x: dino.x + 10, y: y + 18, w: 26, h: 32 }, { x: dino.x + 32, y: y + 2, w: 14, h: 14 }];
  }

  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* ---------- game flow ---------- */
  function reset() {
    obstacles = [];
    speed = START_SPEED;
    score = 0; dist = 0; animT = 0;
    dino.lift = 0; dino.vy = 0;
    night = 0; nightTarget = 0; prevTarget = 0; nightCount = 0;
    flash = 0; lastMile = 0; newRecord = false; spawnWait = 70; jumpBuf = 0;
  }
  function start() { reset(); state = 'running'; syncPauseBtn(); }

  function die() {
    state = 'dead';
    deadAt = performance.now();
    shake = 10;
    sfx.die();
    var s = Math.floor(score);
    if (s > hi) {
      hi = s;
      newRecord = true;
      try { localStorage.setItem('dino-sprint-hi', String(hi)); } catch (e) {}
    }
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    syncPauseBtn();
  }

  function doJump() { dino.vy = 12; dino.lift = 0.01; sfx.jump(); }

  function pressJump() {
    audio();
    jumpHeld = true;
    if (state === 'ready') { start(); doJump(); return; }
    if (state === 'dead') { if (performance.now() - deadAt > 450) start(); return; }
    if (state !== 'running') return;
    if (dino.lift === 0) doJump(); else jumpBuf = 8;
  }
  function releaseJump() { jumpHeld = false; }
  function pressDuck() { audio(); duckHeld = true; }
  function releaseDuck() { duckHeld = false; }

  function togglePause() {
    if (state === 'running') state = 'paused';
    else if (state === 'paused') state = 'running';
    syncPauseBtn();
  }
  function toggleMute() {
    muted = !muted;
    document.getElementById('btnMute').textContent = muted ? 'Ovoz: o‘chiq' : 'Ovoz: yoqiq';
    if (!muted) audio();
  }
  function syncPauseBtn() {
    document.getElementById('btnPause').textContent = state === 'paused' ? 'Davom etish' : 'Pauza';
  }

  function update(dt) {
    animT += dt * (speed / START_SPEED);
    speed = Math.min(MAX_SPEED, speed + 0.0022 * dt);
    var adv = speed * dt;
    dist += adv;
    score += adv * 0.045;

    if (dino.lift > 0) {
      if (!jumpHeld && dino.vy > 5) dino.vy = 5;
      var g = 0.62 * (duckHeld ? 3.4 : 1);
      dino.lift += dino.vy * dt;
      dino.vy -= g * dt;
      if (dino.lift <= 0) {
        dino.lift = 0; dino.vy = 0;
        if (jumpBuf > 0) doJump();
      }
    }
    if (jumpBuf > 0) jumpBuf -= dt;

    // day / night
    var ph = score % 900;
    nightTarget = ph >= 550 ? 1 : 0;
    if (nightTarget === 1 && prevTarget === 0) nightCount++;
    prevTarget = nightTarget;
    night += (nightTarget - night) * 0.015 * dt;

    // scenery
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= adv * 0.12;
      if (c.x < -70) { c.x = W + rand(0, 120); c.y = rand(18, 92); c.s = rand(0.7, 1.2); }
    }
    for (var b = 0; b < bumps.length; b++) {
      var bp = bumps[b];
      bp.x -= adv;
      if (bp.x < -12) { bp.x += W + 24; bp.y = GROUND + 7 + rand(0, 26); bp.w = 2 + Math.floor(rand(0, 7)); }
    }

    // obstacles
    if (!obstacles.length) {
      spawnWait -= dt;
      if (spawnWait <= 0) spawn();
    } else {
      var lastO = obstacles[obstacles.length - 1];
      if (W - (lastO.x + lastO.w) >= lastO.gap) spawn();
    }
    for (var k = obstacles.length - 1; k >= 0; k--) {
      var o = obstacles[k];
      o.x -= (speed + (o.kind === 'ptero' ? 1.6 : 0)) * dt;
      if (o.x + o.w < -30) obstacles.splice(k, 1);
    }

    // milestones
    var mile = Math.floor(score / 100);
    if (mile > lastMile) { lastMile = mile; sfx.point(); flash = 40; }
    if (flash > 0) flash -= dt;

    // collisions
    var db = dinoBoxes();
    for (var m = 0; m < obstacles.length; m++) {
      var ob = obstacles[m];
      if (ob.x > dino.x + 90 || ob.x + ob.w < dino.x - 10) continue;
      var obs = boxesOf(ob);
      for (var x = 0; x < obs.length; x++) {
        for (var y = 0; y < db.length; y++) {
          if (hit(db[y], obs[x])) { die(); return; }
        }
      }
    }
  }

  function drift(dt) {
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= 0.15 * dt;
      if (c.x < -70) { c.x = W + rand(0, 120); c.y = rand(18, 92); }
    }
  }

  /* ---------- drawing ---------- */
  function R(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function drawCloud(c) {
    var s = c.s, x = c.x, y = c.y;
    R(x, y + 8 * s, 44 * s, 8 * s, pal.cloud);
    R(x + 8 * s, y + 2 * s, 22 * s, 8 * s, pal.cloud);
    R(x + 24 * s, y + 5 * s, 16 * s, 8 * s, pal.cloud);
  }

  function leg(x, top, h, c) {
    R(x, top, 8, h, c);
    R(x + 5, top + h - 3, 6, 3, c);
  }

  function drawDino(x, lift, dead, ducking, phase, idle) {
    var fy = GROUND - lift;
    var body = pal.dino, dk = pal.dinoD, belly = pal.belly, ink = pal.ink;
    var y;
    if (ducking) {
      y = fy - 34;
      var bh = phase ? 8 : 4, fh = phase ? 4 : 8;
      leg(x + 14, y + 26, bh, dk);
      R(x, y + 14, 8, 6, body);
      R(x + 6, y + 12, 10, 12, body);
      R(x + 10, y + 10, 34, 16, body);
      R(x + 16, y + 20, 26, 6, belly);
      R(x + 14, y + 6, 4, 5, dk); R(x + 24, y + 5, 4, 6, dk); R(x + 34, y + 6, 4, 5, dk);
      R(x + 38, y + 6, 22, 14, body);
      R(x + 50, y + 16, 10, 2, dk);
      if (dead) {
        R(x + 48, y + 8, 2, 2, ink); R(x + 52, y + 8, 2, 2, ink); R(x + 50, y + 10, 2, 2, ink); R(x + 48, y + 12, 2, 2, ink); R(x + 52, y + 12, 2, 2, ink);
      } else {
        R(x + 48, y + 9, 5, 5, pal.white); R(x + 50, y + 10, 3, 3, ink);
      }
      leg(x + 30, y + 26, fh, body);
      return;
    }
    y = fy - 50;
    var air = lift > 0;
    var bl = air || idle ? 10 : (phase ? 5 : 10);
    var fl = air || idle ? 10 : (phase ? 10 : 5);
    leg(x + 14, y + 40, bl, dk);
    R(x, y + 24, 8, 7, body);
    R(x + 6, y + 20, 10, 12, body);
    R(x + 12, y + 18, 26, 22, body);
    R(x + 18, y + 30, 18, 10, belly);
    R(x + 10, y + 13, 4, 6, dk); R(x + 18, y + 11, 4, 8, dk); R(x + 26, y + 13, 4, 6, dk);
    R(x + 30, y + 8, 12, 14, body);
    R(x + 30, y + 0, 18, 14, body);
    R(x + 38, y + 10, 10, 2, dk);
    if (dead) {
      R(x + 38, y + 3, 2, 2, ink); R(x + 42, y + 3, 2, 2, ink); R(x + 40, y + 5, 2, 2, ink); R(x + 38, y + 7, 2, 2, ink); R(x + 42, y + 7, 2, 2, ink);
    } else {
      R(x + 38, y + 3, 5, 5, pal.white); R(x + 40, y + 4, 3, 3, ink);
    }
    R(x + 36, y + 26, 8, 3, dk);
    R(x + 42, y + 26, 3, 6, dk);
    leg(x + 26, y + 40, fl, body);
  }

  function cactus(x, s) {
    var d = DIM[s], h = d.h, w = d.w;
    var tw = s === 'L' ? 10 : 8;
    var cx = x + (w - tw) / 2;
    var fy = GROUND;
    R(cx, fy - h, tw, h, pal.ink);
    R(cx + 1, fy - h - 2, tw - 2, 2, pal.ink);
    R(cx + 2, fy - h + 3, 2, h - 6, pal.inkL);
    var ay = fy - h * 0.58;
    R(x, ay, (w - tw) / 2 + 2, 4, pal.ink);
    R(x, ay - 10, 4, 14, pal.ink);
    var by = fy - h * 0.4;
    R(cx + tw - 2, by, (w - tw) / 2 + 2, 4, pal.ink);
    R(x + w - 4, by - 8, 4, 12, pal.ink);
  }

  function ptero(x, y, frame) {
    var c = pal.ink;
    R(x + 10, y + 12, 28, 8, c);
    R(x + 34, y + 10, 12, 9, c);
    R(x + 44, y + 13, 10, 3, c);
    R(x + 30, y + 5, 8, 6, c);
    R(x, y + 14, 12, 3, c);
    R(x + 16, y + 18, 14, 3, pal.inkL);
    if (frame === 0) {
      R(x + 20, y + 2, 6, 10, c);
      R(x + 12, y + 0, 12, 4, c);
    } else {
      R(x + 20, y + 20, 6, 8, c);
      R(x + 12, y + 26, 14, 4, c);
    }
    R(x + 39, y + 12, 3, 3, pal.sky);
  }

  function drawMoon() {
    if (night < 0.03) return;
    var mx = W - 110 - ((dist * 0.03) % Math.max(100, W - 220));
    var my = 44;
    var offs = [99, 9, 4, -9];
    ctx.globalAlpha = Math.min(1, night);
    ctx.fillStyle = pal.moon;
    ctx.beginPath(); ctx.arc(mx, my, 14, 0, 6.2832); ctx.fill();
    var ox = offs[nightCount % 4];
    if (ox !== 99) {
      ctx.fillStyle = pal.sky;
      ctx.beginPath(); ctx.arc(mx + ox, my - 2, 13, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawStars(ts) {
    if (night < 0.03) return;
    ctx.fillStyle = pal.white;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var sx = (((s.x - dist * 0.04) % W) + W) % W;
      ctx.globalAlpha = night * (0.3 + 0.7 * Math.abs(Math.sin(ts * 0.0018 + s.p)));
      ctx.fillRect(Math.round(sx), Math.round(s.y), s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawHills() {
    ctx.fillStyle = pal.hill;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (var x = 0; x <= W + 6; x += 6) {
      var wx = x + dist * 0.25;
      var h = 30 + 14 * Math.sin(wx * 0.011) + 10 * Math.sin(wx * 0.027 + 1.3) + 6 * Math.sin(wx * 0.061);
      ctx.lineTo(x, GROUND - h);
    }
    ctx.lineTo(W + 6, GROUND);
    ctx.closePath();
    ctx.fill();
  }

  function centerText(txt, y, size, color) {
    ctx.font = size + 'px ' + FONT;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(txt, W / 2, y);
  }

  function retryIcon(cx, cy) {
    var a = -0.25 * Math.PI;
    ctx.strokeStyle = pal.ink;
    ctx.fillStyle = pal.ink;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, a, a + 1.65 * Math.PI);
    ctx.stroke();
    var px = cx + 14 * Math.cos(a), py = cy + 14 * Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(px - 8, py - 2);
    ctx.lineTo(px + 7, py - 6);
    ctx.lineTo(px + 6, py + 9);
    ctx.closePath();
    ctx.fill();
  }

  function draw(ts) {
    buildPal(Math.max(0, Math.min(1, night)));
    var sc = cv.width / W;
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.textBaseline = 'top';
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);

    ctx.fillStyle = pal.sky;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    drawStars(ts);
    drawMoon();
    drawHills();
    for (var i = 0; i < clouds.length; i++) drawCloud(clouds[i]);

    // ground
    R(0, GROUND, W, 2, pal.ink);
    for (var b = 0; b < bumps.length; b++) R(bumps[b].x, bumps[b].y, bumps[b].w, 2, pal.inkL);

    // obstacles
    for (var k = 0; k < obstacles.length; k++) {
      var o = obstacles[k];
      if (o.kind === 'ptero') ptero(o.x, o.y, Math.floor(animT / 8) % 2);
      else for (var p = 0; p < o.parts.length; p++) cactus(o.x + o.parts[p].dx, o.parts[p].s);
    }

    // dino
    var ducking = (state === 'running' || state === 'paused') && duckHeld && dino.lift === 0;
    var phase = Math.floor(animT / 4.5) % 2;
    drawDino(dino.x, dino.lift, state === 'dead', ducking, phase, state !== 'running');

    // HUD
    ctx.font = '12px ' + FONT;
    ctx.textAlign = 'right';
    var scoreTxt = String(Math.floor(score)).padStart(5, '0');
    var hiTxt = 'HI ' + String(hi).padStart(5, '0');
    if (!(flash > 0 && Math.floor(flash / 5) % 2 === 0)) {
      ctx.fillStyle = pal.ink;
      ctx.fillText(scoreTxt, W - 16, 16);
    }
    ctx.fillStyle = pal.inkL;
    ctx.fillText(hiTxt, W - 16 - 5 * 12 - 20, 16);

    // overlays
    if (state === 'ready') {
      if (Math.floor(ts / 600) % 2 === 0) centerText("BO'SH JOY YOKI TEGING", 92, 12, pal.ink);
      centerText('BOSHLASH UCHUN', 68, 10, pal.inkL);
    } else if (state === 'paused') {
      centerText('PAUZA', 84, 18, pal.ink);
      centerText('DAVOM ETISH: P', 116, 9, pal.inkL);
    } else if (state === 'dead') {
      centerText("O'YIN TUGADI", 56, 18, pal.ink);
      if (newRecord) centerText('YANGI REKORD!', 86, 11, pal.dino);
      retryIcon(W / 2, 128);
      centerText("QAYTA BOSHLASH: BO'SH JOY", 156, 9, pal.inkL);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function frame(ts) {
    var dt = Math.min(3, (ts - last) / 16.667);
    if (!(dt > 0)) dt = 1;
    last = ts;
    if (state === 'running') update(dt);
    else if (state !== 'paused') drift(dt);
    if (shake > 0) shake = Math.max(0, shake - dt);
    draw(ts);
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  window.addEventListener('keydown', function (e) {
    var code = e.code;
    if (code === 'Space' || code === 'ArrowUp' || code === 'ArrowDown') e.preventDefault();
    if (e.repeat) return;
    if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') pressJump();
    else if (code === 'ArrowDown' || code === 'KeyS') pressDuck();
    else if (code === 'KeyP' || code === 'Escape') togglePause();
    else if (code === 'KeyM') toggleMute();
    else if (code === 'Enter' && state === 'dead') pressJump();
  });
  window.addEventListener('keyup', function (e) {
    var code = e.code;
    if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') releaseJump();
    else if (code === 'ArrowDown' || code === 'KeyS') releaseDuck();
  });

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.focus({ preventScroll: true }); } catch (err) {}
    pressJump();
  });
  cv.addEventListener('pointerup', releaseJump);
  cv.addEventListener('pointercancel', releaseJump);

  function hold(id, down, up) {
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); down(); });
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  }
  hold('btnJump', pressJump, releaseJump);
  hold('btnDuck', pressDuck, releaseDuck);

  document.getElementById('btnPause').addEventListener('click', function () { togglePause(); });
  document.getElementById('btnMute').addEventListener('click', toggleMute);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'running') togglePause();
  });
  window.addEventListener('blur', function () { jumpHeld = false; duckHeld = false; });
  window.addEventListener('resize', resize);

  try { if (document.fonts && document.fonts.load) document.fonts.load("12px 'Press Start 2P'"); } catch (e) {}

  resize();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
